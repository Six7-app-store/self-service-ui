name: Checks

# Deliberately a separate workflow, not steps in docker-image.yml: by
# convention nothing is verified inside the image build (the emulated arm64
# build OOM-killed the in-image test run, so checks are a local step). This is
# where the checks live instead — cheap, no Docker, no registry.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # ci, not install: fails on a package-lock.json that disagrees with
      # package.json instead of quietly resolving something else.
      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # Unit tests and the jsdom render tests (*.test.jsx). Runs even when
      # the lint step failed, so one push reports both problems instead of
      # hiding the second behind the first.
      - name: Vitest
        if: '!cancelled()'
        run: npm test

  # Browser tests of the App Store section (e2e/), against intercepted API
  # answers. A job of its own: it needs a browser download the checks above
  # do not, and a failure here should not hide theirs.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - name: Keep screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
